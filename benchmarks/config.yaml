datasets:
  qm2:
    max_train: 1000
    max_test: null
    density_type: "valence"
    split: false
  qm9:
    max_train: 1000
    max_test: null
    grid_res: [192, 128, 96]
    rescale: true
    sigma: 2.0
    overlapping_precision: 1.0e-1
    target: "homo"
    split: false
  qm9_oxygen_shift:
    max_train: 1000
    max_test: null
    grid_res: [64, 64, 64]
    rescale: true
    sigma: 2.0
    overlapping_precision: 1.0e-1
    target: "alpha"
    split: true
    shift: 'O'
  poverty:
    max_train: 1000
    max_test: 250
  skin_lesion:
    max_train: 1000
    max_test: 250
  histology_nuclei:
    max_train: 1000
    max_test: 250
  iwildcam:
    max_train: 1000
    max_test: 250

features:
  scattering_inv_J3_L8:
    J: 3
    L: 8
    max_order: 2
    rot_invariant: true
  scattering_cov_J3_L8:
    J: 3
    L: 8
    max_order: 2
    rot_invariant: false
  scattering_inv_J4_L8:
    J: 4
    L: 8
    max_order: 2
    rot_invariant: true
  scattering_cov_J4_L8:
    J: 4
    L: 8
    max_order: 2
    rot_invariant: false
  scattering_inv_J5_L8:
    J: 5 # skin_lesion - histology_nuclei
    L: 8
    max_order: 2
    rot_invariant: true
  scattering_cov_J5_L8:
    J: 5 # skin_lesion - histology_nuclei
    L: 8
    max_order: 2
    rot_invariant: false
  scattering_inv_J6_L8:
    J: 6
    L: 8
    max_order: 2
    rot_invariant: true
  scattering_cov_J6_L8:
    J: 6
    L: 8
    max_order: 2
    rot_invariant: false
  scattering_inv_J7_L8:
    J: 7 # poverty
    L: 8
    max_order: 2
    rot_invariant: true
  scattering_cov_J7_L8:
    J: 7 # poverty
    L: 8
    max_order: 2
    rot_invariant: false
  scattering_inv_J8_L8:
    J: 8 # qm2d
    L: 8
    max_order: 2
    rot_invariant: true
  scattering_cov_J8_L8:
    J: 8 # qm2d
    L: 8
    max_order: 2
    rot_invariant: false
  scattering_cov_3D_J4_L3:
    J: 4
    L: 3
    sigma_0: 2.0
    max_order: 2
    rot_invariant: false
    method: 'integral'
    points: null
    integral_powers: [0.5, 1.0, 2.0, 3.0, 4.0]
  scattering_inv_3D_J4_L3:
    J: 4
    L: 3
    sigma_0: 2.0
    max_order: 2
    rot_invariant: true
    method: 'integral'
    points: null
    integral_powers: [0.5, 1.0, 2.0, 3.0, 4.0]
  timm_convnext_base:
    pretrained_model: "convnext_base.fb_in1k"
  timm_convnext_atto:
    pretrained_model: "convnext_atto.d2_in1k"
  timm_convnextv2_base:
    pretrained_model: "convnextv2_base.fcmae_ft_in1k"
  timm_convnextv2_atto:
    pretrained_model: "convnextv2_atto.fcmae_ft_in1k"
  timm_dinov2_small:
    pretrained_model: "vit_small_patch14_reg4_dinov2.lvd142m"
  timm_dinov2_base:
    pretrained_model: "vit_base_patch14_reg4_dinov2.lvd142m"
  unimol_qm9:
    dummy: "something"
  unimol_qm2:
    dummy: "something"
  identity:
    dummy: "something"

models:
  baseline:
    noise_var: 1e-2
  gp_exact_reg_lin:
    noise_var: 1e-2
    signal_var: 1.0
    kernel:
      id: linear
  gp_exact_reg_lin_ard:
    noise_var: 1e-2
    signal_var: 1.0
    kernel:
      id: linear
      ard_num_dims: auto
  gp_exact_reg_rbf:
    noise_var: 1e-2
    signal_var: 1.0
    kernel:
      id: rbf
      lengthscale: auto
  gp_exact_reg_rbf_ard:
    noise_var: 1e-2
    signal_var: 1.0
    kernel:
      id: rbf
      lengthscale: auto
      ard_num_dims: auto
  gp_exact_reg_matern52:
    noise_var: 1e-2
    signal_var: 1.0
    kernel: 
      id: matern
      nu: 2.5
      lengthscale: auto
  gp_exact_reg_matern52_ard:
    noise_var: 1e-2
    signal_var: 1.0
    kernel: 
      id: matern
      nu: 2.5
      lengthscale: auto
      ard_num_dims: auto
  gp_approx_reg_rbf:
    num_ip: 100
    noise_var: 1e-2
    signal_var: 1.0
    kernel:
      id: rbf
      lengthscale: auto
  gp_approx_reg_matern52:
    num_ip: 100
    noise_var: 1e-2
    signal_var: 1.0
    kernel:
      id: matern
      nu: 2.5
      lengthscale: auto
  gp_approx_reg_rbf_ard:
    num_ip: 100
    noise_var: 1e-2
    signal_var: 1.0
    kernel:
      id: rbf
      lengthscale: auto
      ard_num_dims: auto
  gp_approx_reg_matern52_ard:
    num_ip: 100
    noise_var: 1e-2
    signal_var: 1.0
    kernel:
      id: matern
      nu: 2.5
      lengthscale: auto
      ard_num_dims: auto
  laplace_reg_mlp:
    layers: [20, 30, 10]
    noise_var: 1e-2
    subset_of_weights: last_layer
    hessian_structure: diag
    pred_type: glm
  ensemble_reg_linear:
    num_models: 10
    # features: layer_norm
  ensemble_reg_nonlinear:
    num_models: 10
    layers: [128]
    activation: tanh
    # features: layer_norm
  ensemble_timm_reg_convnext_atto:
    features_model: "convnextv2_atto.fcmae_ft_in1k"
    num_models: 5
    layers: [128]
    activation: tanh
  ensemble_timm_reg_convnext_base:
    features_model: "convnext_base.fb_in1k"
    num_models: 5
    layers: [128]
    activation: tanh
  ensemble_timm_reg_dinov2_small:
    features_model: "vit_small_patch14_reg4_dinov2.lvd142m"
    num_models: 5
    layers: [128]
    activation: tanh
  ensemble_timm_reg_dinov2_base:
    features_model: "vit_base_patch14_reg4_dinov2.lvd142m"
    num_models: 5
    layers: [128]
    activation: tanh

train:
  epochs: 500
  tol: 1.0e-5
  patience: 100
  normalized_labels: true
  verbose: false

optimizer:
  lr: 1.0e-2
  weight_decay: 0.0

scheduler:
  mode: min
  factor: 0.8
  patience: 200
  threshold: 1.0e-4
  threshold_mode: rel
  cooldown: 0
  min_lr: 0
  eps: 1.0e-8

dataloader:
  batch_size: 20000 #2056
  shuffle: true
  num_workers: 12
  pin_memory: true
  prefetch_factor: 4
  persistent_workers: true
  # multiprocessing_context: spawn

gpytorch:
  max_cholesky_size: 800
  cg_tolerance: 1
  max_cg_iterations: 1000
  fast_computations:
    covar_root_decomposition: true
    log_prob: true
    solves: true

bayesian_opt:
  initial_design_size: 50
  n_iters: 50
