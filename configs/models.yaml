# Regression Baseline
base_reg:
  noise_var: 1e-2

# Regression GP Linear Kernel
gp_reg_lin:
  noise_var: 1e-2
  signal_var: 1.0
  kernel:
    id: linear
gp_reg_lin_ard:
  noise_var: 1e-2
  signal_var: 1.0
  kernel:
    id: linear
    ard_num_dims: auto

# Regression GP RBF Kernel
gp_reg_rbf:
  noise_var: 1e-2
  signal_var: 1.0
  kernel:
    id: rbf
    lengthscale: auto
gp_reg_rbf_ard:
  noise_var: 1e-2
  signal_var: 1.0
  kernel:
    id: rbf
    lengthscale: auto
    ard_num_dims: auto

# Regression GP Matern 5/2 Kernel
gp_reg_matern52:
  noise_var: 1e-2
  signal_var: 1.0
  kernel: 
    id: matern
    nu: 2.5
    lengthscale: auto
gp_reg_matern52_ard:
  noise_var: 1e-2
  signal_var: 1.0
  kernel: 
    id: matern
    nu: 2.5
    lengthscale: auto
    ard_num_dims: auto

# Regression SVGP RBF Kernel
svgp_reg_rbf:
  num_ip: 100
  noise_var: 1e-2
  signal_var: 1.0
  kernel:
    id: rbf
    lengthscale: auto
svgp_reg_rbf_ard:
  num_ip: 100
  noise_var: 1e-2
  signal_var: 1.0
  kernel:
    id: rbf
    lengthscale: auto
    ard_num_dims: auto

# Regression SVGP Matern 5/2 Kernel
svgp_reg_matern52:
  num_ip: 100
  noise_var: 1e-2
  signal_var: 1.0
  kernel:
    id: matern
    nu: 2.5
    lengthscale: auto
svgp_reg_matern52_ard:
  num_ip: 100
  noise_var: 1e-2
  signal_var: 1.0
  kernel:
    id: matern
    nu: 2.5
    lengthscale: auto
    ard_num_dims: auto

# Regression Head Deep Ensemble
headens_reg_linear:
  num_models: 10
  # features: layer_norm
headens_reg_nonlinear:
  num_models: 10
  layers: [128]
  activation: tanh
  # features: layer_norm

# Regression Full Deep Ensemble
fullens_reg_convnext_atto:
  features_model: "convnextv2_atto.fcmae_ft_in1k"
  num_models: 5
  layers: [128]
  activation: tanh
fullens_reg_convnext_base:
  features_model: "convnext_base.fb_in1k"
  num_models: 5
  layers: [128]
  activation: tanh
fullens_reg_dinov2_small:
  features_model: "vit_small_patch14_reg4_dinov2.lvd142m"
  num_models: 5
  layers: [128]
  activation: tanh
fullens_reg_dinov2_base:
  features_model: "vit_base_patch14_reg4_dinov2.lvd142m"
  num_models: 5
  layers: [128]
  activation: tanh

# Regression Conformal MLP (deterministic, constant-width conformal intervals)
cpmlp_reg_nonlinear:
  layers: [128]
  activation: tanh

# Regression Conformalized Quantile Regression (CQR)
cqr_reg_nonlinear:
  layers: [128]
  activation: tanh

# Regression Laplace Approximation
la_reg_nonlinear:
  layers: [128]
  activation: tanh
  noise_var: 1e-2
  subset_of_weights: last_layer
  hessian_structure: diag
  pred_type: glm


# -----------------------------------------------------


# Classification Baseline
base_class:
  noise_var: 1e-2

# Classification SVGP RBF Kernel
svgp_class_rbf:
  num_ip: 100
  noise_var: 1e-2
  signal_var: 1.0
  kernel:
    id: rbf
    lengthscale: auto
svgp_class_rbf_ard:
  num_ip: 100
  noise_var: 1e-2
  signal_var: 1.0
  kernel:
    id: rbf
    lengthscale: auto
    ard_num_dims: auto

# Classification SVGP Matern 5/2 Kernel
svgp_class_matern52:
  num_ip: 100
  noise_var: 1e-2
  signal_var: 1.0
  kernel:
    id: matern
    nu: 2.5
    lengthscale: auto
svgp_class_matern52_ard:
  num_ip: 100
  noise_var: 1e-2
  signal_var: 1.0
  kernel:
    id: matern
    nu: 2.5
    lengthscale: auto
    ard_num_dims: auto

# Classification Head Ensemble
headens_class:
  num_models: 10
  layers: [128]
  activation: tanh

# Classification Full Ensemble
fullens_class_convnext_atto:
  features_model: "convnextv2_atto.fcmae_ft_in1k"
  num_models: 5
fullens_class_convnext_base:
  features_model: "convnext_base.fb_in1k"
  num_models: 5
fullens_class_dinov2_small:
  features_model: "vit_small_patch14_reg4_dinov2.lvd142m"
  num_models: 5
fullens_class_dinov2_base:
  features_model: "vit_base_patch14_reg4_dinov2.lvd142m"
  num_models: 5

# Classification Laplace Approximation
la_class_nonlinear:
  layers: [128]
  activation: tanh
  subset_of_weights: last_layer
  hessian_structure: diag
  pred_type: glm
  link_approx: mc
  n_samples: 100
